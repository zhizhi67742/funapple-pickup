<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fun Apple｜每日接送</title><style>*{box-sizing:border-box}body{margin:0;background:#faf6f3;color:#332a29;font:15px system-ui}header{padding:24px 5%;background:white;border-bottom:1px solid #eaded8;color:#c32e2c;font-weight:bold}main{max-width:1200px;margin:35px auto;padding:0 20px}h1{font-size:32px}p,small{color:#89716a;line-height:1.7}button,input,select,textarea{font:inherit;border:1px solid #e5d7d0;border-radius:9px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#c93330;color:white;border:0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.card,aside{background:white;border:1px solid #eadfd9;border-radius:16px;padding:22px;margin-bottom:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;font-size:13px}textarea{width:100%;min-height:95px;resize:vertical}.wide{grid-column:1/-1}.card h3{margin:0 0 18px}.remove{float:right;color:#b02d2b}aside{position:sticky;top:20px;align-self:start}#preview{min-height:450px;font-size:14px;line-height:1.8}#status{color:#a9322e}summary{cursor:pointer}details{margin:18px 0}a{color:#b62c29}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:static}.fields{grid-template-columns:1fr}.toolbar button{font-size:13px}}@media print{header,.toolbar,.cards,details,#status,aside button,aside small{display:none}.layout{display:block}aside{border:0}#preview{height:900px;border:0}}
.weekly-preview-scroll{overflow:auto;max-width:100%;border:1px solid #eadfd9;border-radius:10px}#weeklyPreview summary{font-weight:700}#weeklyPreview{scroll-margin-top:16px}@media print{#weeklyPreview{display:none}}</style><header>Fun Apple 🍎　行政小幫手 / 每日接送</header><main><small>DAILY PICKUP PLANNER</small><h1>把今天的接送，安排好。</h1><p>按車次編輯，自動計算人數，複製後直接貼到群組。</p><section class="card"><strong>共用雲端同步 · 密碼解鎖編輯</strong><form id="editorLogin"><label>編輯密碼<input id="editorPassword" type="password" autocomplete="current-password" required maxlength="128" placeholder="輸入密碼後即可編輯"></label><button type="submit">解鎖編輯</button></form><button id="editorLogout" hidden>結束編輯／登出</button><p id="editorMessage" role="status">目前為檢視模式</p><p id="syncMessage">正在讀取雲端，請稍候。</p><button id="initializeCloud" hidden>以這台電腦的資料建立雲端</button> <button id="refreshCloud">讀取雲端最新資料</button> <button id="retryCloud" hidden>重試儲存</button></section><div class="toolbar"><input type="date" id="date" aria-label="接送日期"><button id="prev">← 前一天</button><button id="next">後一天 →</button><button id="lastweek">複製上週同一天</button><button id="useTemplate">套用每週底表</button><button id="previewWeek">預覽本週總表</button><button id="saveTemplate">存為此星期底表</button></div><p id="status" role="status"></p><details class="card" id="weeklyPreview"><summary>接送總表預覽</summary><p id="weeklyPreviewMessage" role="status"></p><div class="weekly-preview-scroll"><iframe id="weeklyPreviewFrame" title="本週接送總表" style="display:block;width:1150px;height:920px;border:0;background:white"></iframe></div></details><div class="layout"><section><div id="cards" class="cards"></div><button class="primary" id="add">＋ 新增車次／接送安排</button></section><aside><h2>群組通知預覽</h2><small>新光可不列名單；其他車次依姓名計算人數，學校分組標籤不算人數。</small><textarea id="preview" readonly aria-label="群組通知"></textarea><div class="toolbar"><button class="primary" id="copy">複製通知</button><button onclick="window.print()">列印</button></div><p id="stats"></p></aside></div><details><summary>備份與本週原表</summary><p>名單儲存在共用雲端，所有人都能查看同一份名單；輸入共用編輯密碼後才能修改，不需登入 ChatGPT。初次請在資料最完整的電腦按「建立雲端」。原有瀏覽器資料另留備份，不會自動覆蓋雲端。</p><button id="export">下載備份</button><label>匯入備份<input type="file" id="import" accept="application/json"></label></details></main><datalist id="vehicleOptions"><option value="3998"><option value="6331"><option value="6895"><option value="9251"><option value="1457"></datalist><script src="app.js"></script><script src="sync.js"></script><script src="weekly.js?v=20261105-image-text-fix"></script></html>
